<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Infrastructure Summit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0e1a;
      color: #e8f0fe;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 120, 215, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 120, 215, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridDrift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridDrift {
      from { transform: translateY(0); }
      to   { transform: translateY(60px); }
    }

    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      max-width: 900px;
    }

    .badge {
      display: inline-block;
      background: rgba(0, 120, 215, 0.2);
      border: 1px solid rgba(0, 120, 215, 0.5);
      color: #50c8ff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #50c8ff 70%, #0078d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      color: #8ab4d4;
      line-height: 1.6;
      max-width: 620px;
      margin: 0 auto 3rem;
    }

    .cta-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: default;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: #0078d4;
      color: #fff;
      box-shadow: 0 0 24px rgba(0, 120, 212, 0.45);
    }

    .btn-primary:hover { box-shadow: 0 0 36px rgba(0, 120, 212, 0.65); }

    .btn-outline {
      background: transparent;
      color: #50c8ff;
      border: 1px solid rgba(80, 200, 255, 0.4);
    }

    .btn-outline:hover { border-color: #50c8ff; background: rgba(80, 200, 255, 0.06); }

    .stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 3rem;
      margin-top: 5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #50c8ff;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #5a7a99;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 120, 215, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-top    { top: -200px; left: 50%; transform: translateX(-50%); }
    .glow-bottom { bottom: -200px; right: -100px; }
  </style>
</head>
<body>

  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <section class="hero">
    <div class="badge">&#9650; Powered by Azure</div>
    <h1>Azure Infrastructure<br>Summit</h1>
    <p class="subtitle">
      Deep-dive sessions on cloud infrastructure, IaC, networking,
      security, and the future of Azure-native architectures.
    </p>
    <div class="cta-row">
      <span class="btn btn-primary">Register Now</span>
      <span class="btn btn-outline">View Sessions</span>
    </div>
  </section>

  <div class="stats">
    <div class="stat">
      <div class="stat-number">40+</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat">
      <div class="stat-number">12</div>
      <div class="stat-label">Expert Speakers</div>
    </div>
    <div class="stat">
      <div class="stat-number">2</div>
      <div class="stat-label">Days</div>
    </div>
    <div class="stat">
      <div class="stat-number">1K+</div>
      <div class="stat-label">Attendees</div>
    </div>
  </div>

</body>
</html>
